name: Build & Upload Artifact

on:
  pull_request:
    branches:
      - main
    types:
      - closed

env:
  buildName: NO-CTRL
  itchio_project: leonardobrizuela/noctrl

jobs:
  buildAndUploadArtifact:
    name: Build & upload artifact
    if: github.event.pull_request.merged == true
    runs-on: windows-latest
    steps:

      # Checkouts the repository code
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs : true

      # Caches library folder for faster build times
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}
          restore-keys: Library-

      # Builds the project for Windows Standalone
      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          buildName: ${{ env.buildName }}
          targetPlatform: StandaloneWindows64
          versioning: None 
          customParameters: -Development
      
      # Uploads the build output as a GitHub artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.buildName }}
          path: build

  deployToStore:
    name: Deploy to store
    runs-on: ubuntu-latest
    needs: buildAndUploadArtifact
    steps:

      # Downloads the artifact generated by the build job
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.BuildName }}
          path: build/StandaloneWindows64
      
      - name: Get Previous Tag
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@v2"
        with:
          fallback: 0.1.0 # Optional fallback tag to use when no tag can be found

      # Deploys to Itch.io
      - name: Upload Build to itch.io
        uses: robpc/itchio-upload-action@v1
        with:
          path: build/StandaloneWindows64
          project: ${{ secrets.ITCHIO_PROJECT }}
          channel: ${{ env.itchio_channel }}
          version: ${{ steps.previoustag.outputs.tag }}
          api-key: ${{ secrets.ITCHIO_API_KEY }}
